[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "open-jevlike-infer"
dynamic = ["version"]
description = "Production inference server for open Jev-like decision models, compatible with the Jev / SystemOne /v1/systemone API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Arcobalneo" }]
keywords = ["llm", "inference", "vllm", "decision-model", "jev", "systemone", "clef", "clef-flash"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "numpy>=1.24",
    "pillow>=10",
    "av>=12",
]

[project.optional-dependencies]
# Production backend. PyPI's vllm 0.30.0 is built for CUDA 13 (driver >= 580);
# for CUDA 12 drivers use scripts/install_cuda12.sh instead.
vllm = ["vllm==0.30.0", "safetensors>=0.4", "huggingface_hub>=0.30"]
# Reference backend. causal-conv1d compiles CUDA code and needs nvcc; see docs/models/clef-flash.md.
hf = [
    "torch>=2.11",
    "torchvision",
    "transformers>=5.10.2",
    "accelerate>=1.0",  # load_release_model uses device_map
    "safetensors>=0.4",
    "huggingface_hub>=0.30",
    "flash-linear-attention>=0.5",
]
dev = ["pytest>=8", "ruff>=0.6"]
bench = ["pyarrow>=15", "huggingface_hub>=0.30"]

[project.scripts]
jevlike-infer = "jevlike_infer.cli:main"

[project.urls]
Homepage = "https://github.com/Arcobalneo/open-jevlike-infer"
Issues = "https://github.com/Arcobalneo/open-jevlike-infer/issues"

[tool.hatch.version]
path = "src/jevlike_infer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jevlike_infer"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
